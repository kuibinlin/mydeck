

[project]
name = "mydeck-agent"
version = "0.1.0"
description = "MyDeck agent service — the 中文 tutor loop, outside the Worker's request ceiling."
requires-python = ">=3.12"

# The agent stack is declared now, before the loop that uses it, on purpose.
#
# The container, the lockfile and the Cloud Run cold start are part of THIS
# deliverable, and langchain dominates all three — image size, install time and
# import time. Validating a three-package stub and then swapping in the real
# stack means re-measuring everything that was just signed off, and cold start
# is already a known Cloud Run cost (docs/architecture.md §2: 100ms-2s).
#
# What is deliberately NOT here: retrieval, embeddings, PDF parsing. Those are
# intended (§8.3) but nothing is built against them yet.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # create_agent + init_chat_model. The loop this replaces is ai/agentLoop.js,
    # and with it tools/repair.js (argument coercion) and ai/toolMessages.js
    # (per-provider tool-message shapes) — both are library concerns here.
    "langchain>=1.0",
    # The engine under create_agent, and declared because app/agent/run.py
    # imports from it DIRECTLY — `GraphRecursionError`, which is how a turn that
    # ran out of loop depth is told apart from one that failed. That is the only
    # direct use; the graph itself is never constructed here.
    #
    # It arrives transitively through langchain either way, which is exactly why
    # it is written down. An undeclared import keeps working right up until the
    # package that happened to supply it reorganises, and then it fails at
    # import time on a container nobody changed.
    "langgraph>=1.0",
    # AI_TUTOR_MODEL reaches SEA-LION through an OpenAI-compatible endpoint, the
    # same route backend/src/ai/providers/openaiCompat.js takes.
    "langchain-openai>=0.3",
    # The HSK dictionary is reached with a plain JSON-RPC POST — see
    # app/hsk/mcp.py for why, in short: the server is stateless, and an adapter
    # that hands its tools straight to the model would skip the projection that
    # keeps a 27 KB reply out of the context budget.
    "httpx>=0.27",
    "langfuse>=3.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

# Nothing imports this project as a library — the container copies `app/` and
# runs uvicorn against it. Building a wheel would add a step with no consumer.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"

typeCheckingMode = "strict"

# "strict" is not the same tier in both tools, and swapping mypy --strict for
# pyright strict raised 66 errors. 65 of them were one family: reportUnknown*,
# pyright's rule that no Unknown type may leak anywhere. It fires wherever a
# value crosses an untyped boundary — json.loads() results, MCP responses,
# langchain returns — and mypy --strict does not check that at all.
#
# Those three are therefore off. Everything else stays on, which is still a
# larger set than mypy --strict enforced: reportUnnecessaryCast caught dead code
# in agent/tools/args.py that mypy had passed for months.
#
# Turning them back on is a real project, not a config change: app/hsk/project.py
# alone accounts for 30, and silencing them properly means TypedDicts for the
# HSK server's JSON rather than annotations. Worth doing if that projection ever
# gets subtle — it is a context-budget correctness requirement (CLAUDE.md) — but
# it is not what a type checker swap should smuggle in.
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
