# Deploy the Cloudflare Worker.
#
# This closes the gap that caused the incident this repository is shaped around:
# production served ten-day-old Worker code, including a prompt defect that had
# already been fixed and committed, because deploying was a step someone had to
# remember. The agent service got a pipeline first; this is the half that serves
# every user.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS DEPLOYS, AND WHAT IT DOES NOT
# ─────────────────────────────────────────────────────────────────────────────
#
#   deploys      the Worker script, its bindings, vars and routes — everything
#                in backend/wrangler.toml, because `wrangler deploy` uploads
#                them as one unit (§9)
#
#   does NOT     the D1 database or the KV namespace themselves. Those are
#                Terraform's (infrastructure/terraform/cloudflare), and this
#                workflow only binds to them by the IDs already in
#                wrangler.toml.
#
#   does NOT     secrets. `wrangler secret put` is out of band, by hand, per
#                §10. A deploy does not touch them and cannot clear them.
#
#   does NOT     D1 migrations. `npm run db:migrate` stays manual on purpose —
#                a schema change is not something to apply automatically on
#                merge, and it needs to land before the code that depends on it
#                rather than beside it.

name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys of one Worker at once. Not cancel-in-progress: a half-done
# deploy is worse than a queued one.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # ci.yml already ran these on the pull request. Running them again here is
      # deliberate: a push to main can arrive without a PR — the ruleset lets a
      # repository admin bypass — and this is the last point before real users
      # get the code.
      - run: npm run test:api

      # ─────────────────────────────────────────────────────────────────────
      # APP_VERSION is injected here and is NOT in wrangler.toml.
      #
      # meta.js says why: a version committed to a config file is stale the
      # first time someone forgets to bump it. Injected from the commit that
      # produced the build, it is accurate by construction — and it is what
      # makes the smoke test below able to tell a successful deploy from a
      # silent rollback.
      #
      # Unset, /version reports "development", which is how a laptop is told
      # apart from production.
      # ─────────────────────────────────────────────────────────────────────
      - name: Deploy
        id: deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          set -euo pipefail

          # ADMIN_EMAILS is the one var deliberately absent from wrangler.toml —
          # a personal address, and this repository is public. Unset, nobody is
          # an admin, which fails closed but silently. Fail the deploy instead:
          # losing every admin is not something to discover later.
          if [ -z "${ADMIN_EMAILS:-}" ]; then
            echo "::error::ADMIN_EMAILS repository variable is not set."
            echo "  gh variable set ADMIN_EMAILS --repo ${{ github.repository }}"
            exit 1
          fi

          SHA=$(git rev-parse --short HEAD)
          npx wrangler deploy \
            --var APP_VERSION:"$SHA" \
            --var ADMIN_EMAILS:"$ADMIN_EMAILS"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # /health answers 200 from the PREVIOUS deploy just as happily as from the
      # new one, so it cannot distinguish success from a silent rollback. Only
      # /version can, and only because APP_VERSION was injected above.
      #
      # This is the assertion .github/workflows/README.md argues for, and the
      # reason meta.js keeps APP_VERSION out of committed config.
      #
      # POLLED, NOT CHECKED ONCE. `wrangler deploy` returns when Cloudflare
      # accepts the upload, not when every edge location serves it. A single
      # immediate check races that propagation, and it lost twice — the merges
      # of #14 and #15 both went red here reporting the PREVIOUS version, on
      # deploys that were fine and were serving the new SHA a minute later.
      #
      # That is worse than having no check at all. A deploy step that cries
      # wolf teaches you to read a red X as normal, which is precisely the
      # signal this assertion exists to protect — the same argument that
      # removed the tutor's unobservable fallback in §11 step 9.
      #
      # A version that never becomes the expected one still fails. That is a
      # real silent rollback, and it is what the window is long enough to tell
      # apart from propagation.
      - name: Smoke test
        env:
          EXPECTED: ${{ steps.deploy.outputs.sha }}
        run: |
          set -euo pipefail
          API=https://mydeckapi.linsnotes.com
          DEADLINE=$((SECONDS + 120))
          attempt=0

          # `|| echo unreachable` keeps a transient curl failure from killing
          # the step under `set -e`: mid-propagation is exactly when a request
          # can fail outright, and that is a reason to retry, not to give up.
          while :; do
            attempt=$((attempt + 1))
            STATUS=$(curl -fsS --max-time 10 "$API/health"  | jq -r .status  2>/dev/null || echo unreachable)
            SERVING=$(curl -fsS --max-time 10 "$API/version" | jq -r .version 2>/dev/null || echo unreachable)

            if [ "$STATUS" = "ok" ] && [ "$SERVING" = "$EXPECTED" ]; then
              echo "✅ $API is serving $EXPECTED (attempt $attempt)"
              exit 0
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::$API is serving '$SERVING' with health '$STATUS' after $attempt attempts over 120s — expected '$EXPECTED'."
              echo "The upload was accepted, so a version that never changes means it was rolled back,"
              echo "or a route still points at an older script. Check the Cloudflare dashboard;"
              echo "re-running this job will not change what is deployed."
              exit 1
            fi

            echo "attempt $attempt: health '$STATUS', serving '$SERVING' — waiting for '$EXPECTED'"
            sleep 5
          done
